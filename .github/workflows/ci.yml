name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The suite synthesises its own archives, so it needs no Ford content
    # and runs anywhere.
    strategy:
      fail-fast: false
      matrix:
        # Pinned: ubuntu-latest moved to 26.04, which has no Python 3.9
        # build in setup-python, so 3.9 would fail before the suite runs.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check the CLI starts
        run: |
          python -m fsd --version
          python -m fsd --help

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff
      - run: ruff check .

  no-content:
    # A standing guard: this repository must never gain Ford content.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if disc content was committed
        run: |
          found=$(git ls-files | grep -Ei '\.(arc|epl|iso|img|enc|cab|hdr|inx)$' || true)
          if [ -n "$found" ]; then
            echo "::error::Ford disc content must not be committed:"
            echo "$found"
            exit 1
          fi
          big=$(git ls-files -z | xargs -0 -I{} find {} -size +2M 2>/dev/null || true)
          if [ -n "$big" ]; then
            echo "::error::Unexpectedly large files committed:"
            echo "$big"
            exit 1
          fi
          echo "Clean: no disc content in the repository."
